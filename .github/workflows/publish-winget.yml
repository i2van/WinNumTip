name: publish winget

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g., 1.7.0). Leave empty to use the latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Get release info
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $requestedVersion = '${{ inputs.version }}'

          if ($requestedVersion) {
            $version = $requestedVersion -replace '^v', ''
            $tag = "v$version"
            $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          } else {
            $release = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            $tag = $release.tag_name
            $version = $tag -replace '^v', ''
          }

          $expectedAssets = @(
            'WinNumTip-Win32.zip'
            'WinNumTip-x64.zip'
            'WinNumTip-ARM64.zip'
          )
          $assetNames = @($release.assets.name)
          $missingAssets = @($expectedAssets | Where-Object { $_ -notin $assetNames })

          if ($missingAssets.Count) {
            throw "Release $tag is missing required assets: $($missingAssets -join ', ')"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag"         >> $env:GITHUB_OUTPUT

      - name: Publish ${{ steps.release.outputs.version }} to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: i2van.WinNumTip
          version: ${{ steps.release.outputs.version }}
          installers-regex: 'WinNumTip-(Win32|x64|ARM64)\.zip$'
          release-tag: ${{ steps.release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
